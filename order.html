<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head text-center">
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
          <p>กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ รายการสินค้าและราคาจะถูกเติมให้อัตโนมัติเมื่อคุณเลือกจากหน้าสินค้า</p>
        </div>

        <form id="orderForm" class="form">
          <div class="form__group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form__group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form__group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form__group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="form__group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--accent btn--block">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="text-center" style="margin-top: var(--space-4);">
          <a href="product.html" style="border-bottom: 1px solid var(--accent); padding-bottom: 2px;">เลือกสินค้าเพิ่มเติม</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. Every Mood, Every Scent.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
