<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <!-- สไตล์ตารางเฉพาะหน้านี้ -->
  <style>
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #ordersTable th {
      padding: var(--space-2);
      font-family: var(--font-sans);
      font-weight: 400;
      text-align: left;
      color: var(--ink-soft);
      background: var(--cream);
      border-bottom: 1px solid var(--line-strong);
      white-space: nowrap;
    }

    #ordersTable td {
      padding: var(--space-2);
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable td:first-child {
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head text-center">
          <h1>รายการสั่งซื้อ</h1>
          <hr class="divider">
          <p>แสดงรายการล่าสุดก่อน ข้อมูลดึงจาก Google Sheet</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร / Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. Every Mood, Every Scent.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
